<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src https: blob:; frame-src https://www.youtube.com https://www.youtube-nocookie.com;">
<title>AVA PiP</title>
<style>
  /* ============================================================
     آوا — پنجرهٔ ویدیوی شناور (Smart Gaming PiP) — تم شیشهٔ مایع
     پنجرهٔ الکترون شفاف است؛ پس “پس‌زمینه” یعنی خودِ شیشهٔ گردِ
     نیمه‌شفاف روی بازی. هیچ‌چیز فوکوس نمی‌قاپد (focusable:false).
     ============================================================ */
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-drag: none; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body {
    font-family: Vazirmatn, 'Segoe UI', Tahoma, sans-serif;
    color: #d9f5ea;
    border-radius: 16px;
  }

  /* شیشهٔ اصلی — تیرهٔ نیمه‌شفاف تا HUD بازی دیده بماند */
  .pip-root {
    position: absolute; inset: 0;
    border-radius: 16px;
    background: rgba(5, 10, 9, 0.62);
    border: 1px solid rgba(52, 211, 153, 0.38);
    box-shadow: 0 0 0 1px rgba(0,0,0,.35), 0 10px 34px rgba(0,0,0,.35);
    overflow: hidden;
    transition: border-color .25s ease;
  }
  .pip-root.ct { border-color: rgba(52, 211, 153, 0.16); } /* حالت click-through: مرز کم‌رنگ‌تر */
  .pip-root.dragging { border-color: rgba(52, 211, 153, 0.9); cursor: grabbing; }

  /* ناحیهٔ ویدیو */
  .media { position: absolute; inset: 0; }
  .media video, .media iframe {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border: 0; background: #000; border-radius: 16px;
  }

  /* واترمارک لوگوی آوا — گوشهٔ چپِ بالا، خیلی کم‌مزاحم */
  .brand {
    position: absolute; top: 7px; left: 9px; z-index: 5;
    display: flex; align-items: center; gap: 5px;
    opacity: .75; pointer-events: none;
    transition: opacity .2s ease;
  }
  .brand img { width: 20px; height: 20px; border-radius: 50%; box-shadow: 0 0 8px rgba(16,185,129,.55); }
  .brand span { font-size: 10px; font-weight: 700; color: #a7f3d0; text-shadow: 0 1px 3px #000; letter-spacing: .4px; }
  .pip-root.show-ui .brand { opacity: 1; }

  /* حالت خالی — هنوز ویدیویی پین نشده */
  .empty {
    position: absolute; inset: 0; z-index: 4;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 9px; text-align: center; padding: 14px;
    background: radial-gradient(120% 120% at 50% 0%, rgba(16,185,129,.14), transparent 60%);
  }
  .empty img.logo { width: 58px; height: 58px; border-radius: 50%; box-shadow: 0 0 22px rgba(16,185,129,.45); }
  .empty h1 { font-size: 12.5px; font-weight: 800; color: #eafff5; }
  .empty p { font-size: 10.5px; line-height: 1.9; color: #9fdcc4; }
  .empty code {
    direction: rtl; display: inline-block; margin-top: 2px; padding: 2px 8px;
    border-radius: 7px; background: rgba(16,185,129,.16); border: 1px solid rgba(52,211,153,.35);
    color: #6ee7b7; font-size: 10.5px; font-family: inherit; font-weight: 700;
  }
  .empty .warn { font-size: 9.5px; color: #86b9a5; }
  .empty.hidden, .media.hidden { display: none; }

  /* نوار کنترل شیشه‌ای پایین — data-ui یعنی «قابل کلیک» (برای click-through هوشمند) */
  .bar {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; align-items: center; gap: 4px;
    padding: 5px 8px;
    background: linear-gradient(0deg, rgba(3,8,6,.92), rgba(3,8,6,.55));
    border-top: 1px solid rgba(52, 211, 153, .3);
    opacity: 0; transform: translateY(4px);
    transition: opacity .18s ease, transform .18s ease;
  }
  .pip-root.show-ui .bar { opacity: 1; transform: none; }
  .bar .grip {
    flex: 1; height: 22px; border-radius: 7px; cursor: grab;
    display: flex; align-items: center; justify-content: center; gap: 4px;
    color: #7fd8b4; font-size: 10px; font-weight: 700;
    background: rgba(16,185,129,.07); border: 1px dashed rgba(52,211,153,.25);
  }
  .bar .grip:active { cursor: grabbing; }
  .bar button {
    min-width: 26px; height: 24px; padding: 0 7px;
    border-radius: 8px; border: 1px solid rgba(52,211,153,.3);
    background: rgba(16,185,129,.1); color: #c9fbe8;
    font-family: inherit; font-size: 10.5px; font-weight: 700; cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .bar button:hover { background: rgba(16,185,129,.28); color: #fff; }
  .bar button.on { background: rgba(52,211,153,.85); color: #04231a; }
  .bar .x { border-color: rgba(248,113,113,.4); background: rgba(239,68,68,.12); color: #fecaca; }
  .bar .x:hover { background: rgba(239,68,68,.4); color: #fff; }
</style>
</head>
<body>
  <div class="pip-root" id="root">
    <!-- ناحیهٔ ویدیو: یا <video> مستقیم یا iframe یوتیوب -->
    <div class="media hidden" id="mediaWrap">
      <video id="vid" playsinline></video>
      <div id="ytWrap" style="position:absolute;inset:0;display:none">
        <iframe id="yt" title="AVA PiP — YouTube" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
      </div>
    </div>

    <!-- حالت خالی + راهنمای صوتی -->
    <div class="empty" id="empty">
      <img class="logo" src="assets/ava-logo.png" alt="AVA" draggable="false">
      <h1>ویدیوی شناور آوا</h1>
      <p>
        ویدیویی پین نشده — به آوا بگو:<br>
        <code>«ویدیو رو پین کن»</code>
      </p>
      <p class="warn">
        یا لینک یوتیوب را کپی کنید و دوباره بگویید ·
        بازی باید Borderless Windowed باشد نه Exclusive Fullscreen
      </p>
    </div>

    <!-- واترمارک لوگو -->
    <div class="brand"><img src="assets/ava-logo.png" alt="" draggable="false"><span>AVA</span></div>

    <!-- نوار کنترل — data-ui = ناحیهٔ کلیک‌پذیر در حالت click-through -->
    <div class="bar" id="bar" data-ui="1">
      <button class="x" id="btnClose" title="بستن (بگو: بردارش)" data-ui="1">✕</button>
      <button id="btnLock" title="قفل کلیک (کلیک از روی پنجره رد شود)" data-ui="1">🔓</button>
      <button id="btnOpacity" title="شفافیت (چرخه: ۱۰۰→۷۰→۵۰→۳۰)" data-ui="1">◐</button>
      <button id="btnSize" title="اندازه (چرخه)" data-ui="1">⤢</button>
      <div class="grip" id="grip" title="برای جابجایی بگیرید و بکشید" data-ui="1">⋮⋮ جابجایی ⋮⋮</div>
    </div>
  </div>
  <script src="js/pipRenderer.js"></script>
</body>
</html>
