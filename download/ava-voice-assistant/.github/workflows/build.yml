name: ساخت نصب‌کننده ویندوز (AVA Installer)

# هر بار که یک تگ نسخه (مثل v0.2.0) پوش شود، این workflow به‌صورت خودکار
# نصب‌کننده EXE ویندوز را می‌سازد و به بخش Releases همان ریپو اضافه می‌کند
# تا هر کاربری بتواند مستقیم از گیت‌هاب دانلودش کند.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # اجازه اجرای دستی از تب Actions

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: دریافت سورس
        uses: actions/checkout@v4

      - name: نصب Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: نصب وابستگی‌ها
        run: npm install

      - name: ساخت نصب‌کننده NSIS
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: آپلود آرتیفکت (خروجی هر اجرا)
        uses: actions/upload-artifact@v4
        with:
          name: AVA-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error

      - name: انتشار در Releases (فقط روی تگ)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
