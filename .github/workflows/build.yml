# ============================================================
#  AVA Voice Assistant - Build & Release
#  ------------------------------------------------------------
#  * Push a tag (v*)  -> test battery (ubuntu) -> Windows installer
#    -> asar inspect -> DRAFT GitHub Release (publish manually
#    after verifying, see RELEASING.md / gh_release_tools.py).
#  * Manual run (workflow_dispatch) -> build only, installer
#    appears under the run's Artifacts (for testing).
#
#  Guards:
#  - tag must match package.json version (fail-fast, before build)
#  - npm ci + npm cache (deterministic install)
#  - test job gates the build job
#  - asar inspect fails if a critical file is missing from the
#    package (the v0.55.1 lesson: file missing from build.files
#    = dead app after install)
#
#  NOTE: if your app folder is the repo ROOT, change
#  "working-directory" and the artifact path below to "."
# ============================================================
name: Build & Release AVA

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# one release at a time per ref; never cancel a running release build
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: download/ava-voice-assistant

jobs:
  test:
    name: Test battery (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: download/ava-voice-assistant/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run test battery
        run: node scripts/run-battery.js

  build:
    name: Build installer (windows)
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard — tag must match package.json version
        shell: bash
        run: |
          set -e
          PKG_VER="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG  package.json=$PKG_VER"
            if [ "$TAG" != "v$PKG_VER" ]; then
              echo "::error::Tag $TAG does not match package.json version $PKG_VER — bump first: node scripts/bump-version.js ${TAG#v}"
              exit 1
            fi
          else
            echo "::notice::not a tag ref ($GITHUB_REF) — tag/version guard skipped (manual run)"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: download/ava-voice-assistant/package-lock.json

      - name: Install dependencies
        run: npm ci

      # electron-builder needs the real repository URL to publish.
      # GITHUB_REPOSITORY is "user/repo", so this can never be wrong.
      - name: Fix repository field for electron-builder
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.repository={type:'git',url:'https://github.com/'+process.env.GITHUB_REPOSITORY+'.git'};p.build=p.build||{};p.build.publish={provider:'github',releaseType:'draft'};fs.writeFileSync('package.json',JSON.stringify(p,null,2));"

      - name: Build & upload installer as DRAFT to GitHub Releases
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Asar inspect — critical files must be inside app.asar
        shell: bash
        run: |
          set -e
          ASAR="dist/win-unpacked/resources/app.asar"
          if [ ! -f "$ASAR" ]; then
            ASAR="$(ls -1 dist/*/resources/app.asar 2>/dev/null | head -n 1)"
          fi
          if [ -z "$ASAR" ] || [ ! -f "$ASAR" ]; then
            echo "::error::app.asar not found under dist/"
            exit 1
          fi
          echo "inspecting: $ASAR"
          # v0.60 CI fix: read the list via the asar JS API (no npx resolution games),
          # normalize path separators, and fail loudly on an empty list.
          node -e "
            const fs = require('fs');
            const path = require('path');
            const asar = require('@electron/asar');
            const list = asar.listPackage(process.argv[1]).map(p => p.split(path.sep).join('/'));
            fs.writeFileSync('asar-list.txt', list.join('\n') + '\n');
            console.log('asar entries: ' + list.length);
            if (!list.length) { console.error('asar list is EMPTY — inspect cannot proceed'); process.exit(1); }
          " "$ASAR"
          MISSING=0
          for f in main.js preload.js pipCore.js pipPreload.js pipWindowManager.js lib/dns-bypass.js renderer/index.html renderer/js/app.js renderer/css/styles.css renderer/fonts/Vazirmatn-Regular.woff2; do
            if grep -Eq "(^|/)${f}$" asar-list.txt; then
              echo "  ok      $f"
            else
              echo "  MISSING $f"
              MISSING=1
            fi
          done
          rm -f asar-list.txt
          if [ "$MISSING" != "0" ]; then
            echo "::error::critical file(s) missing from app.asar — the v0.55.1 lesson (missing file from build.files = dead app)"
            exit 1
          fi

      - name: Upload installer as artifact (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: AVA-Windows-Installer
          path: download/ava-voice-assistant/dist/*.exe
          if-no-files-found: ignore
